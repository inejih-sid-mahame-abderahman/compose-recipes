services:
  pyetlenv:
    container_name: pyetlenv
    build: .
    command: sh -c "python3 -m http.server 8000"
    volumes:
      - ./work:/work

  etldb:
    container_name: etldb
    image: postgres:14-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_DB=etldb
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin12345
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d etldb"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:latest
    depends_on:
      etldb:
        condition: service_healthy
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin12345
    ports:
      - "127.0.0.1:8032:80"
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json:ro

  etlkafka:
    container_name: etlkafka
    image: apache/kafka:latest
    environment:
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_NODE_ID=0
      - KAFKA_LISTENERS=PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://etlkafka:9092,EXTERNAL://localhost:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@etlkafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_NUM_PARTITIONS=2
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    volumes:
      - ./data/kafka:/var/lib/kafka/data
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:9094:9094"

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=etlkafka:9092
    depends_on:
      - etlkafka

  nifi:
    image: apache/nifi:latest
    container_name: nifi
    ports:
      - "127.0.0.1:8443:8443"
    environment:
      - SINGLE_USER_CREDENTIALS_USERNAME=admin
      - SINGLE_USER_CREDENTIALS_PASSWORD=adminadmin123
    volumes:
      - ./data/nifi/data:/opt/nifi/nifi-current/data/
      - ./data/nifi/logs:/opt/nifi/nifi-current/logs

  prefect-server:
    image: prefecthq/prefect:2-python3.11
    container_name: prefect-server
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:14200:4200"
    command: prefect server start --host 0.0.0.0 --port 4200

  prefect-runner:
    build: ./prefect
    container_name: prefect-runner
    depends_on:
      - prefect-server
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      SQLITE_PATH: /shared/sqlite/etl.db
      RUN_DIR: /shared/runs
    volumes:
      - ./prefect/flows:/flows
      - ./work:/work
      - ./data/prefect:/shared
    command: bash -lc "sleep infinity"